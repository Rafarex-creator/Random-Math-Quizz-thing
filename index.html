      { topic: "Charts", question: "A bar chart shows 18 books read in January and 25 in February. How many more books were read in February?", options: ["5", "7", "18", "43"], answer: 1, explanation: "Find the difference: 25 − 18 = 7." },
      { topic: "Charts", question: "In a pie chart, a sector is 90°. What fraction of the whole circle is this?", options: ["1/2", "1/3", "1/4", "1/8"], answer: 2, explanation: "A full circle is 360°. 90 ÷ 360 = 1/4." },
      { topic: "Ratio", question: "Orange squash and water are mixed in the ratio 1:4. How much water is needed for 250 ml of squash?", options: ["62.5 ml", "250 ml", "500 ml", "1,000 ml"], answer: 3, explanation: "For every 1 part squash there are 4 parts water. 4 × 250 ml = 1,000 ml." },
      { topic: "Decimals", question: "Calculate: 7.35 − 2.8", options: ["4.45", "4.55", "5.45", "5.55"], answer: 1, explanation: "Write 2.8 as 2.80, then 7.35 − 2.80 = 4.55." }
    ];

    questions[45].answer = questions[45].correctFix;
    delete questions[45].correctFix;

    const optionLetters = ["A", "B", "C", "D"];
    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;
    let submitted = false;

    const counter = document.getElementById("question-counter");
    const scoreLabel = document.getElementById("score-label");
    const progressFill = document.getElementById("progress-fill");
    const topicLabel = document.getElementById("topic-label");
    const questionText = document.getElementById("question-text");
    const optionsBox = document.getElementById("answer-options");
    const submitButton = document.getElementById("submit-button");
    const nextButton = document.getElementById("next-button");
    const feedbackPanel = document.getElementById("feedback-panel");

    function renderQuestion() {
      const item = questions[currentQuestion];
      selectedAnswer = null;
      submitted = false;
      counter.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      scoreLabel.textContent = `Score: ${score}`;
      progressFill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      topicLabel.textContent = item.topic;
      questionText.textContent = item.question;
      optionsBox.innerHTML = "";
      feedbackPanel.className = "mt-6 hidden rounded-2xl border p-5";
      submitButton.disabled = true;
      submitButton.classList.remove("hidden");
      nextButton.classList.add("hidden");

      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-option";
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", "false");
        button.innerHTML = `<span class="answer-letter">${optionLetters[index]}</span><span>${option}</span>`;
        button.addEventListener("click", () => chooseAnswer(index));
        optionsBox.appendChild(button);
      });
    }

    function chooseAnswer(index) {
      if (submitted) return;
      selectedAnswer = index;
      [...optionsBox.children].forEach((button, buttonIndex) => {
        const isSelected = buttonIndex === index;
        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-checked", String(isSelected));
      });
      submitButton.disabled = false;
    }

    function submitAnswer() {
      if (selectedAnswer === null || submitted) return;
      submitted = true;
      const item = questions[currentQuestion];
      const isCorrect = selectedAnswer === item.answer;
      if (isCorrect) score += 1;

      [...optionsBox.children].forEach((button, index) => {
        button.disabled = true;
        if (index === item.answer) button.classList.add("correct");
        if (index === selectedAnswer && !isCorrect) button.classList.add("wrong");
      });

      scoreLabel.textContent = `Score: ${score}`;
      feedbackPanel.classList.remove("hidden");
      feedbackPanel.classList.add(isCorrect ? "feedback-correct" : "feedback-wrong");
      document.getElementById("feedback-icon").innerHTML = isCorrect
        ? '<i data-lucide="check-circle-2" class="h-6 w-6 text-[#14734f]"></i>'
        : '<i data-lucide="circle-x" class="h-6 w-6 text-[#b53e37]"></i>';
      document.getElementById("feedback-heading").textContent = isCorrect ? "Correct — well done!" : "Not quite.";
      document.getElementById("feedback-answer").textContent = `Correct answer: ${optionLetters[item.answer]}. ${item.options[item.answer]}`;
      document.getElementById("feedback-explanation").textContent = item.explanation;

      submitButton.classList.add("hidden");
      nextButton.classList.remove("hidden");
      nextButton.focus();
      lucide.createIcons();
    }

    function goNext() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion += 1;
        renderQuestion();
        questionText.focus();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("quiz-panel").classList.add("hidden");
      document.getElementById("results-panel").classList.remove("hidden");
      progressFill.style.width = "100%";
      counter.textContent = "Quiz complete";
      scoreLabel.textContent = `Final score: ${score}`;

      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById("final-score").textContent = `${score} / ${questions.length}`;
      document.getElementById("final-percentage").textContent = `${percentage}%`;

      let message;
      if (percentage >= 90) message = "Outstanding work! You have shown confident understanding across a wide range of Year 8 maths.";
      else if (percentage >= 70) message = "Strong work! Review a few topics and you will be even more secure.";
      else if (percentage >= 50) message = "A solid effort. Use the explanations to revisit the questions that challenged you.";
      else message = "Keep practising — every answer is a chance to learn. Try again and aim to improve your score.";
      document.getElementById("performance-message").textContent = message;
      document.getElementById("results-title").focus();
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      document.getElementById("results-panel").classList.add("hidden");
      document.getElementById("quiz-panel").classList.remove("hidden");
      renderQuestion();
      questionText.focus();
    }

    submitButton.addEventListener("click", submitAnswer);
    nextButton.addEventListener("click", goNext);
    document.getElementById("restart-button").addEventListener("click", restartQuiz);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !submitted && selectedAnswer !== null && !submitButton.disabled) {
        submitAnswer();
      }
    });

    lucide.createIcons();
    renderQuestion();
  </script>
 
</body></html>
